name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  # Supported platforms — these gate merges.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deterministic end-to-end demo (no credentials)
        run: node dist/bin/agent-loop.js demo
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Package contents (npm pack dry-run validation)
        run: npm run verify:pack

  # Windows is NOT a supported platform yet (shell-free spawn cannot launch .cmd/.bat
  # provider/git shims; POSIX process groups differ). This job is informational only
  # and must never block a merge — it tracks progress toward Windows support.
  windows-experimental:
    name: windows (experimental, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
