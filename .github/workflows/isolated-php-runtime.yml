name: Isolated open-source PHP validation dependencies
on:
  push:
    branches: [tablelane/validation-runtime-20261008]
    paths: [.github/workflows/isolated-php-runtime.yml]
permissions: {}
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Collect public PHP, MariaDB and WordPress distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/bundle"
          docker run --rm -i -v "$PWD/bundle:/out" php:8.2.29-cli-bookworm bash -s <<'SCRIPT'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends mariadb-server libzip-dev libffi-dev ca-certificates curl xz-utils
          docker-php-ext-install -j2 mysqli zip ffi
          r=/out/runtime
          mkdir -p "$r/bin" "$r/sbin" "$r/lib/mysql" "$r/ext" "$r/share"
          cp -L /usr/local/bin/php "$r/bin/php"
          cp -L /usr/sbin/mariadbd "$r/sbin/mariadbd"
          for b in mariadb mariadb-admin mariadb-dump mariadb-install-db my_print_defaults resolveip; do test ! -f "/usr/bin/$b" || cp -L "/usr/bin/$b" "$r/bin/$b"; done
          cp -a /usr/share/mysql "$r/share/mysql"
          cp -a /usr/lib/mysql/plugin "$r/lib/mysql/plugin"
          cp /usr/local/lib/php/extensions/*/{mysqli,zip,ffi}.so "$r/ext/"
          find "$r/bin" "$r/sbin" "$r/ext" "$r/lib/mysql/plugin" -type f -print0 | while IFS= read -r -d '' f; do
            ldd "$f" 2>/dev/null | awk '/=> \// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' | while read -r dep; do
              case "$(basename "$dep")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|ld-linux*) continue ;; esac
              cp -L -n "$dep" "$r/lib/" || true
            done || true
          done
          php -r 'if(PHP_VERSION !== "8.2.29" || !extension_loaded("mysqli")) exit(1);'
          { php -v; php -m; mariadbd --version; cat /etc/os-release; } > /out/runtime-provenance.txt
          tar -C /out -czf /out/native-runtime.tar.gz runtime
          rm -rf "$r"
          curl -fL --retry 3 https://wordpress.org/wordpress-7.1.3.tar.gz -o /out/wordpress-7.1.3.tar.gz
          curl -fL --retry 3 https://wordpress.org/wordpress-6.7.tar.gz -o /out/wordpress-6.7.tar.gz
          curl -fL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /out/wp-cli.phar
          cd /out
          sha256sum native-runtime.tar.gz wordpress-*.tar.gz wp-cli.phar > SHA256SUMS
          SCRIPT
      - name: Retain disposable open-source dependencies
        uses: actions/upload-artifact@v4
        with:
          name: php-8.2.29-wordpress-native-validation-runtime
          path: bundle/
          compression-level: 0
          retention-days: 3
