name: Isolated native PHP compatibility dependencies
on:
  push:
    branches: [validation/php-8.2.29-20261008]
    paths: [.github/workflows/native-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Compile exact PHP and retain native dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/native/{bin,sbin,lib,share}
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential autoconf pkg-config libxml2-dev libssl-dev libzip-dev libffi-dev zlib1g-dev libcurl4-openssl-dev libonig-dev mariadb-server
          curl -fL --retry 2 https://www.php.net/distributions/php-8.2.29.tar.xz -o php.tar.xz
          echo '475f991afd2d5b901fb410be407d929bc00c46285d3f439a02c59e8b6fe3589c  php.tar.xz' | sha256sum -c -
          tar -xf php.tar.xz
          cd php-8.2.29
          ./configure --prefix=/tmp/tl-php --enable-cli --disable-cgi --without-pear --with-mysqli=mysqlnd --enable-mysqlnd --with-openssl --with-zlib --with-ffi --with-zip --with-curl --enable-mbstring --enable-pcntl > ../configure.log
          make -j2 > ../make.log
          make install >> ../make.log
          cd ..
          cp /tmp/tl-php/bin/php bundle/native/bin/
          cp /usr/sbin/mariadbd bundle/native/sbin/
          for x in mariadb mariadb-admin mariadb-dump mariadb-install-db my_print_defaults resolveip; do test ! -f "/usr/bin/$x" || cp "/usr/bin/$x" bundle/native/bin/; done
          cp -a /usr/share/mysql bundle/native/share/
          cp -a /usr/lib/mysql bundle/native/lib/
          find bundle/native -type f -print0 | while IFS= read -r -d '' f; do
            (ldd "$f" 2>/dev/null || true) | awk '{for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' | while read -r dep; do
              case "$(basename "$dep")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|ld-linux*) continue ;; esac
              cp -L -n "$dep" bundle/native/lib/ || true
            done
          done
          bundle/native/bin/php -n -r 'if(PHP_VERSION!=="8.2.29"||!extension_loaded("mysqli"))exit(1);'
          { bundle/native/bin/php -n -v; bundle/native/bin/php -n -m; mariadbd --version; } > bundle/provenance.txt
          tar -C bundle -czf bundle/native-runtime.tar.gz native
          rm -rf bundle/native
          curl -fL --retry 2 https://wordpress.org/wordpress-6.8.3.tar.gz -o bundle/wordpress-6.8.3.tar.gz
          curl -fL --retry 2 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o bundle/wp-cli.phar
          cd bundle
          sha256sum *.gz *.phar > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: native-php-8.2.29-wordpress
          path: bundle/
          compression-level: 0
          retention-days: 3
